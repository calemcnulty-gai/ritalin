name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'v*-alpha*'
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Compile TypeScript
        run: npm run compile
        
      - name: Install vsce
        run: npm install -g @vscode/vsce
        
      - name: Increment build number
        run: npm run version:build
        
      - name: Package Extension
        run: |
          if [[ "${{ github.ref }}" == *"alpha"* ]] || [[ "${{ github.event.inputs.release_type }}" == "alpha" ]]; then
            npm run package:alpha
          else
            npm run package
          fi
        
      - name: Get version and build info
        id: version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$(node -p "require('./package.json').buildMetadata?.buildNumber || 0")" >> $GITHUB_OUTPUT
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }} (Build ${{ steps.version.outputs.BUILD_NUMBER }})
          files: '*.vsix'
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || github.event.inputs.release_type == 'alpha' }}
          generate_release_notes: true
          body: |
            ## Ritalin for Cursor - v${{ steps.version.outputs.VERSION }}
            **Build Number**: ${{ steps.version.outputs.BUILD_NUMBER }}
            
            ### Installation Instructions
            
            1. Download the `.vsix` file from the assets below
            2. Open Cursor
            3. Go to the Extensions view (Cmd+Shift+X on macOS, Ctrl+Shift+X on Windows/Linux)
            4. Click the "..." menu at the top of the Extensions view
            5. Select "Install from VSIX..."
            6. Choose the downloaded `.vsix` file
            
            ### What's New
            
            ${{ contains(github.ref, 'alpha') || github.event.inputs.release_type == 'alpha' && 'This is an **alpha release** - expect bugs and incomplete features!' || 'See the changelog for details.' }}
            
            Please report any issues on our [GitHub Issues](https://github.com/ritalin-dev/ritalin/issues) page.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Publish to VS Code Marketplace
        if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && github.event.inputs.release_type != 'alpha' && env.VSCE_PAT != '' }}
        run: vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true  # Don't fail the workflow if marketplace publish fails 